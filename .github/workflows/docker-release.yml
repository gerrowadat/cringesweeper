name: Build and Push Docker Image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU lets the runner emulate ARM for the final image layers (not the Go build)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64  — standard x86-64 servers/desktops
          # linux/arm64  — Raspberry Pi 4/5 (64-bit OS), Apple M-series, AWS Graviton
          # linux/arm/v7 — Raspberry Pi 2/3/4 (32-bit OS)
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.created_at }}
          # Disable provenance attestations — ghcr.io returns 403 on the extra
          # manifest pushes they generate when combined with multi-platform builds
          provenance: false
          # Use GitHub Actions cache instead of a registry cache tag, avoiding
          # an extra push that can also trigger 403s on first-time package creation
          cache-from: type=gha
          cache-to: type=gha,mode=max
